[project]
name = "nano-lab-mvp"
version = "0.1.0"
description = "MVP backend for workflow-driven project and document analysis"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
